<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Step-by-step student guide for the PLTW IED Automoblox C9 modeling project.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Automoblox C9 Build Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky step rail (the 5 phases) → one phase on screen at a time; parts as a second tab row; drawing beside the numbers. */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#18222e; --muted:#5b6876; --line:#d6dce3;
  --accent:#c4122f; --accent-ink:#ffffff; --accent-soft:#fbe7ea;
  --measure:#fff3a6; --measure-line:#e2c400; --measure-ink:#4a3d00;
  --given:#ddf1cf; --given-line:#8cc46a; --given-ink:#21431a;
  --warn:#9a5b00; --warn-soft:#fff1dc; --ok:#2f7d32;
  --sheet:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1b222a; --ink:#e6ebf0; --muted:#9aa7b4; --line:#2f3944;
  --accent:#ff5470; --accent-ink:#1a0006; --accent-soft:#3a1820;
  --measure:#4a4000; --measure-line:#c9ad18; --measure-ink:#fff3a6;
  --given:#1f3a1a; --given-line:#5f9a45; --given-ink:#cfeebe;
  --warn:#ffb54d; --warn-soft:#3a2a10; --ok:#7fd283; --sheet:#f4f6f8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222a; --ink:#e6ebf0; --muted:#9aa7b4; --line:#2f3944;
  --accent:#ff5470; --accent-ink:#1a0006; --accent-soft:#3a1820;
  --measure:#4a4000; --measure-line:#c9ad18; --measure-ink:#fff3a6;
  --given:#1f3a1a; --given-line:#5f9a45; --given-ink:#cfeebe;
  --warn:#ffb54d; --warn-soft:#3a2a10; --ok:#7fd283; --sheet:#f4f6f8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.1;margin:0}
h1{font-size:clamp(34px,5vw,52px);letter-spacing:.01em}
h2{font-size:32px}
h3{font-size:22px}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted);font-weight:600}

/* top rail */
header.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;white-space:nowrap;color:var(--ink);text-decoration:none}
.brand b{color:var(--accent)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:0;padding:0;list-style:none;flex:1}
.steps a{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;border:1px solid transparent}
.steps a:hover{background:var(--bg)}
.steps a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;border:1.5px solid currentColor}
.steps a.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps a[aria-current="page"].done .n{border-color:var(--surface)}

main{padding-block:28px 64px}
section.view{display:grid;gap:24px}
.intro{display:grid;gap:8px;max-width:70ch}
.intro p{color:var(--muted)}

/* start */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
.hero img{border-radius:6px;display:block;width:100%}
.hero .intro p{font-size:19px}
.roadmap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:s}
.roadmap a{display:grid;gap:6px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);min-width:0}
.roadmap a:hover{border-color:var(--ink)}
.roadmap .k{font-family:var(--f-mono);color:var(--accent);font-size:13px}
.roadmap strong{font-family:var(--f-display);font-size:22px}
.roadmap span{color:var(--muted);font-size:15px}
.roadmap .st{font-size:13px;font-weight:600;color:var(--muted)}
.roadmap .st.ok{color:var(--ok)}
.need{display:flex;gap:10px 28px;flex-wrap:wrap;color:var(--muted);font-size:16px}
.need b{color:var(--ink)}

.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 6px 6px 0;max-width:80ch}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout b{font-weight:600}

/* part tabs */
.parts{display:flex;gap:6px;flex-wrap:wrap}
.parts button{font:inherit;font-weight:600;font-size:15px;cursor:pointer;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;gap:8px;align-items:center}
.parts button[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.parts .chip{font-family:var(--f-mono);font-size:12px;padding:1px 6px;border-radius:999px;background:var(--bg);color:var(--muted)}
.parts .chip.ok{background:var(--ok);color:#fff}

.work{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px;position:relative}
.sheet img{display:block;width:100%;height:auto;cursor:zoom-in}
.sheet .zoom{position:absolute;right:10px;bottom:10px;font:600 13px var(--f-body);padding:4px 10px;border-radius:999px;border:1px solid #c9d0d8;background:#fff;color:#18222e;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid}
.sw.m{background:var(--measure);border-color:var(--measure-line)}
.sw.g{background:var(--given);border-color:var(--given-line)}

table.dims{width:100%;border-collapse:collapse}
.dims td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.dims tr:last-child td{border-bottom:0}
.dims .d{font-family:var(--f-mono);font-weight:600;width:52px}
.dims .desc{font-size:15px}
.dims .src{display:block;font-size:13px;color:var(--muted)}
.dims .v{width:118px;text-align:right}
.mt{display:inline-flex;align-items:center;gap:5px;margin:3px 0 0;font:600 12px var(--f-body);letter-spacing:.02em;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;width:max-content}
.dims .desc .mt{display:flex}
.mt:hover{border-color:var(--ink)}
.dims .tip{display:block;font-size:13px;color:var(--muted);margin-top:3px;max-width:42ch}
.guide summary{font-size:17px}
.calgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.calgrid figure{margin:0;display:grid;gap:8px;align-content:start}
.calimg{padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in}
.calimg img{display:block;width:100%;height:auto}
.calgrid figcaption{display:grid;gap:2px;font-size:15px}
.calgrid figcaption span{color:var(--muted)}
.field{display:flex;align-items:center;justify-content:flex-end;border-radius:5px;border:1.5px solid var(--measure-line);background:var(--measure);color:var(--measure-ink);padding-right:8px}
.field input{width:72px;font:600 16px var(--f-mono);background:transparent;border:0;color:inherit;text-align:right;padding:7px 4px 7px 8px;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input:focus{outline:none}
.field:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.field.bad{border-color:var(--warn)}
.unit{font:13px var(--f-mono);opacity:.8}
.given{display:flex;justify-content:flex-end;align-items:center;gap:4px;border-radius:5px;border:1.5px solid var(--given-line);background:var(--given);color:var(--given-ink);padding:7px 8px;font:600 16px var(--f-mono)}
.given.empty{opacity:.65;font-weight:400}
.hint{font-size:13px;color:var(--warn);display:block;text-align:right}

.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 16px var(--f-body);cursor:pointer;padding:10px 16px;border-radius:6px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{font-size:14px;padding:6px 12px}
.btn:hover{filter:brightness(.95)}

/* checklist */
.checks{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:6px;cursor:pointer}
.checks label:hover{background:var(--bg)}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.checks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.q{font-family:var(--f-mono);font-size:15px;background:var(--bg);padding:1px 6px;border-radius:4px;border:1px solid var(--line)}

/* model view numbers */
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.num{border-radius:6px;padding:8px 10px;border:1.5px solid;display:grid;gap:2px;min-width:0}
.num.m{background:var(--measure);border-color:var(--measure-line);color:var(--measure-ink)}
.num.g{background:var(--given);border-color:var(--given-line);color:var(--given-ink)}
.num.miss{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.num .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.num .dd{font:600 14px var(--f-mono)}
.num .val{font:600 22px var(--f-mono)}
.num .val small{font-size:13px;font-weight:400}
.num .ds{font-size:13px;line-height:1.3;opacity:.85}
.videobox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px;border-radius:8px;background:var(--ink);color:var(--surface)}
.videobox .play{width:48px;height:48px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.videobox .play svg{fill:var(--accent-ink)}
.videobox .txt{flex:1;min-width:180px}
.videobox .txt small{display:block;opacity:.75}
.videobox .btn{border-color:var(--surface);background:var(--surface);color:var(--ink)}
.phase{display:flex;gap:14px;align-items:flex-start;padding-top:12px;border-top:2px solid var(--ink)}
.phase-k{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:700 22px var(--f-display)}
.phase h3{margin-bottom:2px}
.phase p{color:var(--muted);max-width:75ch}
#missing:empty{display:none}
.done-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;border:1.5px dashed var(--line);flex-wrap:wrap}
.done-row label{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.done-row input{width:22px;height:22px;accent-color:var(--ok)}
.done-row .save{color:var(--muted);font-size:15px}
.fix{display:grid;gap:6px}
.fix table{border-collapse:collapse;font-size:15px}
.fix td,.fix th{padding:6px 10px;border:1px solid var(--line);text-align:left}
.fix th{font-weight:600;background:var(--bg)}

/* summary */
.tblwrap{overflow-x:auto}
.summary{border-collapse:collapse;width:100%;font-size:15px;min-width:520px}
.summary th,.summary td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
.summary th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted)}
.summary td.val{font-family:var(--f-mono);text-align:right}
.summary tr.partrow td{font-family:var(--f-display);font-size:18px;font-weight:700;padding-top:14px}
.summary .miss{color:var(--warn);font-weight:600}
details.more{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.more summary{cursor:pointer;padding:12px 16px;font-weight:600}
details.more > div{padding:0 16px 16px;display:grid;gap:10px}
textarea{width:100%;min-height:90px;font:14px var(--f-mono);border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

dialog.lightbox{border:0;padding:0;max-width:96vw;max-height:94vh;background:#fff;border-radius:8px}
dialog.lightbox img{display:block;max-width:96vw;max-height:88vh;width:auto;height:auto}
dialog.lightbox p{margin:0;padding:10px 14px 14px;color:#18222e;font-size:16px;max-width:70ch}
dialog.lightbox::backdrop{background:rgba(10,14,20,.8)}
dialog.lightbox form{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#18222e;color:#fff}
dialog.lightbox button{font:600 15px var(--f-body);background:#fff;color:#18222e;border:0;border-radius:999px;padding:5px 14px;cursor:pointer}

@media (max-width:900px){
  .hero,.work{grid-template-columns:minmax(0,1fr)}
  .roadmap{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
@media (max-width:560px){
  .steps a{padding:4px 8px 4px 4px;font-size:13px}
  .steps{flex-basis:100%}
  .steps .lbl{display:none}
  .steps a[aria-current="page"] .lbl{display:inline}
  .dims .v{width:104px}
}
@media (prefers-reduced-motion:no-preference){.btn,.parts button,.roadmap a{transition:border-color .15s,background .15s}}
</style>
</head>

<main class="wrap" id="main"></main>

  ["D0","m","middle section width"],["D1","m","middle section height"],["D2","m","middle section depth"],
  ["D3","g","middle section taper angle",0,"°"],["D4","g","fillet radius: 4 front-to-back edges",7.5],
  ["D5","m","height of cavity"],["D6","m","width of cavity"],["D7","m","depth of cavity"],
  ["D8","g","cavity taper angle",0,"°"],["D9","g","fillet radius: vertical edges of cavity",5]]},
 {id:"front", n:2, name:"Front", dims:[
  ["D0","m","front section length"],["D1","c","front section height",["middle","D1"]],["D2","c","front section width",["middle","D0"]],
  ["D3","g","front section taper angle",0,"°"],["D4","g","fillet radius on 4 front-to-back edges",7.5],
  ["D5","m","distance from hole center to back edge"],["D6","m","distance from hole center to bottom edge"],
  ["D7","g","hole diameter",7.5],["D8","g","hole depth",9]]},
 {id:"rear", n:3, name:"Rear", dims:[
  ["D0","c","rear section length",["front","D0"]],["D1","c","rear section height",["middle","D1"]],["D2","c","rear section width",["middle","D0"]],
  ["D3","g","rear section taper angle",0,"°"],["D4","g","fillet radius on 4 front-to-back edges",7.5],
  ["D5","m","distance from hole center to front edge"],["D6","c","distance from hole center to top edge","rearD6"],
  ["D7","g","hole diameter",7.5],["D8","g","hole depth",9]]},
 {id:"windshield", n:4, name:"Windshield", dims:[
  ["D0","m","windshield length"],["D3","m","windshield width"],["D4","g","windshield taper angle",0,"°"],
  ["D5","g","fillet radius: 2 front-to-back edges",14],["D6","m","windshield shell thickness"],
  ["D7","m","height: bottom of insert to bottom of windshield"],["D8","c","insert length",["middle","D5"]],
  ["D9","c","insert width",["middle","D6"]],["D10","m","distance: windshield front edge to insert"],
  ["D12","g","insert taper angle",0,"°"],["D13","c","fillet radius: insert edges",["middle","D9"]],["D14","m","insert wall thickness"]]},
 {id:"axle", n:5, name:"Axle", dims:[], download:true},
 {id:"wheel", n:6, name:"Wheel", dims:[
  ["D0","m","wheel thickness (front-to-back distance)"],["D1","m","barrel inside diameter"],["D2","m","barrel outside diameter"],
  ["D3","m","barrel wall to top of lip"],["D4","m","lip width"],["D5","m","barrel inner width"],
  ["D6","m","hub outer diameter"],["D7","m","hub wall thickness"],["D8","m","hub length"],
  ["D9","g","hub taper angle",0,"°"],["D10","g","rim fillet radius",3.5],["D11","g","hub fillet radius",1.5]]},
 {id:"tire", n:7, name:"Tire", dims:[
  ["D0","c","inner diameter",["wheel","D2"]],["D1","m","outer diameter"],["D2","c","tire width",["wheel","D0"]],
  ["D3","c","lip diameter","tireD3"],["D4","c","lip depth",["wheel","D4"]],["D5","g","outer edge fillet radius",2.5]]}
];
/* Which caliper measurement each yellow box needs (outside / inside / step / depth). */
const MT = {
  outside:{name:"Outside", full:"Outside diameter or object thickness", how:"Close the <b>large lower jaws</b> on the outside of the part. Use this for widths, lengths, thicknesses and outside diameters."},
  inside: {name:"Inside",  full:"Inside diameter or space width", how:"Put the <b>small upper jaws</b> inside the opening and slide them apart until they touch both walls. Use this for holes and pockets."},
  step:   {name:"Step",    full:"Stepped parallel surfaces", how:"Open the calipers, rest the <b>end of the sliding jaw</b> on the upper surface, then slide the main beam down until it touches the lower step."},
  depth:  {name:"Depth",   full:"Depth of hole or recess", how:"Rest the <b>end of the main beam</b> on the top surface and slide the <b>thin depth rod</b> down until it touches the bottom."}
};
const MTYPE = {
  "middle.D0":"outside","middle.D1":"outside","middle.D2":"outside","middle.D5":"inside","middle.D6":"inside","middle.D7":"depth",
  "front.D0":"outside",
  "windshield.D0":"outside","windshield.D3":"outside","windshield.D6":"outside","windshield.D7":"step","windshield.D10":"step","windshield.D14":"outside",
  "wheel.D0":"outside","wheel.D1":"inside","wheel.D2":"outside","wheel.D3":"step","wheel.D4":"outside","wheel.D5":"inside","wheel.D6":"outside","wheel.D7":"outside","wheel.D8":"outside",
  "tire.D1":"outside"
};
/* Extra tips shown under a yellow box. */
const TIPS = {
  "front.D5":"You can't touch the center of a hole. Measure to the <b>near edge</b> of the hole, then add 3.75 mm (half of the 7.5 mm hole).",
  "front.D6":"Measure to the <b>near edge</b> of the hole, then add 3.75 mm (half of the 7.5 mm hole).",
  "rear.D5":"Measure to the <b>near edge</b> of the hole, then add 3.75 mm (half of the 7.5 mm hole)."
};
function mtChip(key){const m=MTYPE[key];return m?`<button class="mt" data-zoom="cal_${m}" title="${MT[m].full}"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2 2h3v9h2V2h2v9h5v3H2z" fill="currentColor"/></svg>${MT[m].name} measurement</button>`:""}
function caliperGuide(){
  return `<details class="more guide" id="guide"><summary>How to use the calipers: 4 types of measurements</summary><div>
    <p>Each yellow box has a tag that tells you which type to use. Click the tag to see the picture.</p>
    <div class="calgrid">${Object.entries(MT).map(([k,m],i)=>`<figure><button class="calimg" data-zoom="cal_${k}"><img src="${IMG["cal_"+k]}" alt="${m.full}"></button><figcaption><b>${i+1}. ${m.full}</b><span>${m.how}</span></figcaption></figure>`).join("")}</div>
  </div></details>`;
}
const P = Object.fromEntries(PARTS.map(p=>[p.id,p]));
const pname = id => `${P[id].n}. ${P[id].name}`;

const STEPS = [
  {id:"setup",   n:1, title:"Set up Inventor", blurb:"Make a folder so all your part files stay together."},
  {id:"parts",   n:2, title:"Measure & model", blurb:"One part at a time: measure it with calipers, then model it in Inventor."},
  {id:"assemble",n:3, title:"Assemble", blurb:"Put all the parts together into one car."},
  {id:"render",  n:4, title:"Render", blurb:"Make a realistic picture of your finished car."}
];

const SETUP = [
  "Launch <b>Inventor</b>.",
  "Click <b>Open</b>.",
  `Check that <b>Look in:</b> is set to your <b>Inventor</b> folder (<span class="q">Documents → Inventor</span>).`,
  `Click the <b>New Folder</b> button (yellow arrow in the picture) and create a new folder called <span class="q">Automoblox C9</span>.`,
  "Click <b>Cancel</b> to close the dialog box. Now, you're ready to begin."
];

/* ---------- state ---------- */
const KEY="automoblox-c9-v1";
let S={vals:{},setup:[],modeled:{},assembled:false,rendered:false,part:{cur:"middle"}};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(!S.part||!P[S.part.cur]) S.part={cur:"middle"};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function num(v){return v===""||v==null||isNaN(+v)?null:+v}
function fmt(v){return v==null?"—":(Math.round(v*100)/100).toString()}

function value(pid,did){
  const d=P[pid].dims.find(x=>x[0]===did); if(!d) return null;
  const [_,k,,src]=d;
  if(k==="m") return num(S.vals[pid+"."+did]);
  if(k==="g") return src;
  if(Array.isArray(src)) return value(src[0],src[1]);
  if(src==="rearD6"){const a=value("middle","D1"),b=value("front","D6");return a==null||b==null?null:a-b}
  if(src==="tireD3"){const a=value("tire","D0");return a==null?null:a+3}
  return null;
}
function sourceText(d){
  const [,k,,src]=d;
  if(k==="g") return "Given — already filled in";
  if(Array.isArray(src)) return `Same as ${pname(src[0])} ${src[1]}`;
  if(src==="rearD6") return "1. Middle D1 − 2. Front D6";
  if(src==="tireD3") return "Tire D0 + 3";
  return "";
}
const measurable = p => p.dims.filter(d=>d[1]==="m");
function measuredCount(p){return measurable(p).filter(d=>num(S.vals[p.id+"."+d[0]])!=null).length}
const totalM = PARTS.reduce((a,p)=>a+measurable(p).length,0);
const totalDone = ()=>PARTS.reduce((a,p)=>a+measuredCount(p),0);
const modelParts = PARTS;
function stepDone(id){
  if(id==="setup") return SETUP.every((_,i)=>S.setup[i]);
  if(id==="parts") return modelParts.every(p=>S.modeled[p.id]);
  if(id==="assemble") return !!S.assembled;
  if(id==="render") return !!S.rendered;
}
function stepStatus(id){
  if(id==="setup") return `${SETUP.filter((_,i)=>S.setup[i]).length} of ${SETUP.length} done`;
  if(id==="parts") return `${modelParts.filter(p=>S.modeled[p.id]).length} of ${modelParts.length} parts done`;
  return stepDone(id)?"Done":"Not started";
}

/* ---------- routing ---------- */
const VIEWS=["start",...STEPS.map(s=>s.id),"numbers"];
function route(){let h=location.hash.slice(1);if(h==="measure"||h==="model")h="parts";return VIEWS.includes(h)?h:"start"}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

function renderSteps(cur){
  document.getElementById("steps").innerHTML=STEPS.map(s=>
    `<li><a href="#${s.id}" class="${stepDone(s.id)?"done":""}" ${cur===s.id?'aria-current="page"':""}><span class="n">${stepDone(s.id)?"✓":s.n}</span><span class="lbl">${s.title}</span></a></li>`).join("");
}

function render(){
  const v=route(); renderSteps(v);
  const m=document.getElementById("main");
  m.innerHTML=({start:vStart,setup:vSetup,parts:vParts,assemble:vAssemble,render:vRender,numbers:vNumbers})[v]();
  bind(v);
}

function pager(prev,next){
  const s=id=>STEPS.find(x=>x.id===id)||{title:"Overview",n:""};
  return `<nav class="pager">${prev?`<a class="btn" href="#${prev}">← ${prev==="start"?"Overview":"Step "+s(prev).n+": "+s(prev).title}</a>`:"<span></span>"}
  ${next?`<a class="btn primary" href="#${next}">Step ${s(next).n}: ${s(next).title} →</a>`:""}</nav>`;
}

/* ---------- views ---------- */
function vStart(){
  return `<section class="view">
  <div class="hero">
    <div class="intro">
      <span class="label">IED · Modeling project</span>
      <h1>Build the Automoblox C9 in Inventor</h1>
      <p>You'll measure a real wooden toy car, then turn it into a 3D model. Everything you need is on this page: the drawings, a place to type your measurements, and the tutorial videos.</p>
      <p>Work through the steps in order. Your progress saves in this browser as you go.</p>
      <div class="btnrow" style="margin-top:8px"><a class="btn primary" href="#${nextStep()}">${totalDone()||S.setup.length?"Pick up where you left off":"Start with Step 1"} →</a></div>
    </div>
    <img src="${IMG.car}" alt="Automoblox C9 toy car: a wooden body with a red windshield and red wheels">
  </div>
  <div class="roadmap">${STEPS.map(s=>`<a href="#${s.id}"><span class="k">STEP ${s.n}</span><strong>${s.title}</strong><span>${s.blurb}</span><span class="st ${stepDone(s.id)?"ok":""}">${stepDone(s.id)?"✓ ":""}${stepStatus(s.id)}</span></a>`).join("")}</div>
  <div class="need"><span><b>You need:</b></span><span>Digital calipers</span><span>The Automoblox C9 car parts</span><span>Inventor</span></div>
  </section>`;
}
function nextStep(){return (STEPS.find(s=>!stepDone(s.id))||STEPS[STEPS.length-1]).id}

function partTabs(){
  const cur=S.part.cur;
  return `<div class="parts" role="tablist">${PARTS.map(p=>{
    const t=measurable(p).length, m=measuredCount(p);
    const chip=S.modeled[p.id]?`<span class="chip ok">✓ done</span>`:(t?`<span class="chip">${m}/${t}</span>`:`<span class="chip">download</span>`);
    return `<button role="tab" data-part="${p.id}" aria-selected="${cur===p.id}">${p.n}. ${p.name} ${chip}</button>`}).join("")}</div>`;
}
function drawing(p){
  return IMG[p.id]?`<div class="sheet"><img src="${IMG[p.id]}" alt="Dimensioned drawing of ${pname(p.id)}" data-zoom="${p.id}"><button class="zoom" data-zoom="${p.id}">Enlarge</button></div>`:"";
}

function missingNote(p){
  const miss=p.dims.filter(d=>value(p.id,d[0])==null);
  if(!miss.length) return "";
  const own=miss.filter(d=>d[1]==="m").map(d=>d[0]);
  const other=miss.filter(d=>d[1]!=="m").map(d=>`${d[0]} (${sourceText(d).replace("Same as ","from ")})`);
  return `<div class="callout warn"><b>Finish measuring first.</b> Still empty: ${[...own,...other].join(", ")}.${other.length?" Some of these come from an earlier part, so measure that part too.":""}</div>`;
}
function vParts(){
  const p=P[S.part.cur];
  const head=`<div class="intro"><span class="label">Step 2 of 4</span><h2>Measure and model the parts</h2>
    <p>Work on one part at a time: <b>measure it, then model it</b>, then move on to the next part. Go in order, because some parts reuse numbers from earlier parts.</p></div>
    <div class="callout"><b>Millimeters only.</b> Check that your calipers read <b>mm</b>, not inches, before you start.</div>
    ${caliperGuide()}
    ${partTabs()}`;
  let body;
  if(p.download){
    body=`<div class="panel"><h3>${pname(p.id)}</h3>
      <p>Nothing to measure or model. Your teacher already made the axle. Download it into your <span class="q">Automoblox C9</span> folder:</p>
      ${BUNDLED.axle
        ? `<ol style="margin:0;padding-left:22px;display:grid;gap:4px"><li>Click the button below to download <span class="q">5. Axle.ipt</span>.</li><li>${MOVE}</li></ol>
           <div class="btnrow"><button class="btn primary" data-dl="axle">Download 5. Axle.ipt</button></div>`
        : `<ol style="margin:0;padding-left:22px;display:grid;gap:4px"><li>Right-click the button below.</li><li>Choose <b>Save link as…</b></li><li>Save it in your <span class="q">Automoblox C9</span> folder as <span class="q">5. Axle.ipt</span>.</li></ol>
           <div class="btnrow"><a class="btn primary" href="${esc(CONFIG.links.axle)}" target="_blank" rel="noopener">5. Axle.ipt</a></div>`}
      ${doneRow(p,"Saved in my Automoblox C9 folder")}</div>`;
  } else {
    let extra="";
    if(p.id==="windshield") extra=`<div class="callout warn"><b>Heads up: use the XY plane, not the plane in the video.</b> The video starts its first sketch on the <span class="q">YZ Plane</span>. <b>Start yours on the <span class="q">XY Plane</span> instead.</b> If you use YZ, the windshield image comes in sideways. Follow everything else in the video as shown.</div><div class="callout"><b>Before you start:</b> download the windshield image and save it in your <span class="q">Automoblox C9</span> folder. The video uses it.${BUNDLED.windshield?` ${MOVE}`:""}<div class="btnrow" style="margin-top:8px">${BUNDLED.windshield?`<button class="btn small" data-dl="windshield">Download windshield image</button>`:`<a class="btn small" href="${esc(CONFIG.links.windshieldImage)}" target="_blank" rel="noopener">Download windshield image</a>`}</div></div>`;
    if(p.id==="wheel"){const a=value("wheel","D10"),b=value("wheel","D11");
      extra=`<div class="callout warn fix"><b>The video has a mistake. Swap these numbers:</b>
      <div class="tblwrap"><table><tr><th>When the video says</th><th>Type this instead</th></tr>
      <tr><td class="mono">D9</td><td><span class="mono">${fmt(a)} mm</span> (your D10, rim fillet)</td></tr>
      <tr><td class="mono">D10</td><td><span class="mono">${fmt(b)} mm</span> (your D11, hub fillet)</td></tr></table></div></div>`;}
    body=`<div class="phase"><span class="phase-k">A</span><div><h3>Measure the ${p.name.toLowerCase()}</h3>
        <p>Find each dimension on the drawing, measure that spot on the real part, and type it in the yellow box. Green boxes fill in by themselves.</p></div></div>
      <div class="work">${drawing(p)}
        <div class="panel">
          <div class="panel-head"><h3>${pname(p.id)}</h3><span class="label" id="mcount">${measuredCount(p)} of ${measurable(p).length} measured</span></div>
          <div class="legend"><span><i class="sw m"></i>You measure this</span><span><i class="sw g"></i>Filled in for you</span></div>
          <table class="dims"><tbody>${p.dims.map(d=>row(p,d)).join("")}</tbody></table>
        </div></div>
      <div class="phase"><span class="phase-k">B</span><div><h3>Model the ${p.name.toLowerCase()}</h3>
        <p>Play the video. Every time it uses a D-number, type <b>your</b> number from the table above, not the number in the video.</p></div></div>
      <div id="missing">${missingNote(p)}</div>
      ${videoBox(p.id,pname(p.id))}
      ${extra}
      ${doneRow(p)}`;
  }
  return `<section class="view">${head}${body}
    <div class="btnrow"><a class="btn small" href="#numbers">See all my measurements</a></div>
    ${pager("setup","assemble")}</section>`;
}
function row(p,d){
  const [id,k,desc,,unit]=d, key=p.id+"."+id;
  if(k==="m"){
    const raw=S.vals[key]??"";
    return `<tr><td class="d">${id}</td><td class="desc">${esc(desc)}${mtChip(key)}${TIPS[key]?`<span class="tip">${TIPS[key]}</span>`:""}</td><td class="v">
      <div class="field" data-f="${key}"><input id="in-${p.id}-${id}" inputmode="decimal" type="number" step="any" min="0" value="${esc(raw)}" data-key="${key}" aria-label="${pname(p.id)} ${id}: ${esc(desc)}, millimeters"><span class="unit">mm</span></div>
      <span class="hint" data-h="${key}"></span></td></tr>`;
  }
  const v=value(p.id,id);
  return `<tr><td class="d">${id}</td><td class="desc">${esc(desc)}<span class="src">${sourceText(d)}</span></td><td class="v">
    <div class="given ${v==null?"empty":""}" data-calc="${key}">${v==null?"waiting":fmt(v)} <span class="unit">${unit||"mm"}</span></div></td></tr>`;
}
function checkHint(key,raw){
  const v=num(raw);
  if(raw==="") return "";
  if(v==null||v<0) return "Type a number";
  if(v>160) return "Too big. In mm?";
  return "";
}

function vSetup(){
  return `<section class="view">
    <div class="intro"><span class="label">Step 1 of 4</span><h2>Set up Inventor</h2>
    <p>This puts every part file for this project in one folder, so the assembly can find them later.</p></div>
    <div class="work">
      <div class="panel"><ul class="checks">${SETUP.map((t,i)=>`<li><label><input type="checkbox" data-setup="${i}" ${S.setup[i]?"checked":""}><span>${typeof t==="function"?t():t}</span></label></li>`).join("")}</ul></div>
      <div class="sheet"><img src="${IMG.dialog}" alt="Inventor Open dialog with the New Folder button marked by a yellow arrow" data-zoom="dialog"><button class="zoom" data-zoom="dialog">Enlarge</button></div>
    </div>
    <p style="color:var(--muted);font-size:15px">Your <b>Look in:</b> box should show <span class="q">Inventor</span>, like the picture.</p>
    ${pager("start","parts")}
  </section>`;
}

function videoBox(key,label){
  const url=CONFIG.videos[key];
  const play=`<span class="play"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M6 3l11 7-11 7z"/></svg></span>`;
  return url
   ? `<div class="videobox">${play}<div class="txt"><b>${label} tutorial</b><small>Opens in a new tab. Keep this page open next to it.</small></div><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Watch video</a></div>`
   : `<div class="videobox">${play}<div class="txt"><b>${label} tutorial</b><small>Find the “${label}” video on the Canvas assignment page.</small></div></div>`;
}

function doneRow(p,label){
  return `<div class="done-row"><label><input type="checkbox" data-modeled="${p.id}" ${S.modeled[p.id]?"checked":""}> ${label||"I finished modeling this part"}</label>
  ${p.download?"":`<span class="save">Save as <span class="q">${p.n}. ${p.name}.ipt</span> in your Automoblox C9 folder</span>`}
  ${p.n<7?`<button class="btn small primary" data-next-part="1" style="margin-left:auto">Next part: ${pname(PARTS[p.n].id)} →</button>`:`<a class="btn small primary" href="#assemble" style="margin-left:auto">Step 3: Assemble →</a>`}</div>`;
}

function simpleStep(n,key,title,blurb,flag,doneLabel,prev,next){
  return `<section class="view">
    <div class="intro"><span class="label">Step ${n} of 4</span><h2>${title}</h2><p>${blurb}</p></div>
    ${videoBox(key,title)}
    <div class="done-row"><label><input type="checkbox" data-flag="${flag}" ${S[flag]?"checked":""}> ${doneLabel}</label></div>
    ${pager(prev,next)}
  </section>`;
}
function vAssemble(){
  const left=modelParts.filter(p=>!S.modeled[p.id]);
  return simpleStep(3,"assembly","Assemble","Follow the video to put all seven parts together into one car."+(left.length?` <br><span style="color:var(--warn)">Still to finish in Step 2: ${left.map(p=>pname(p.id)).join(", ")}.</span>`:""),"assembled","My assembly is finished","parts","render");
}
function vRender(){return simpleStep(4,"rendering","Render","Follow the video to make a realistic picture of your finished car.","rendered","My rendering is finished","assemble",null)}

function vNumbers(){
  let rows="";
  PARTS.forEach(p=>{ if(!p.dims.length) return;
    rows+=`<tr class="partrow"><td colspan="4">${pname(p.id)}</td></tr>`;
    p.dims.forEach(d=>{const v=value(p.id,d[0]);
      rows+=`<tr><td class="mono">${d[0]}</td><td>${esc(d[2])}</td><td>${d[1]==="m"?"Measured":"Filled in"}</td><td class="val ${v==null?"miss":""}">${v==null?"missing":fmt(v)+" "+(d[4]||"mm")}</td></tr>`});
  });
  return `<section class="view">
    <div class="intro"><span class="label">All measurements</span><h2>My Automoblox C9 numbers</h2>
    <p>${totalDone()} of ${totalM} measurements done. Anything marked <span style="color:var(--warn);font-weight:600">missing</span> still needs measuring.</p></div>
    <div class="btnrow"><button class="btn primary" id="copyAll">Copy as a table</button><a class="btn" href="#parts">Back to the parts</a></div>
    <p style="color:var(--muted);font-size:15px">“Copy as a table” lets you paste everything into a Google Sheet or Doc to turn in.</p>
    <div class="panel tblwrap"><table class="summary"><thead><tr><th>Dim</th><th>Description</th><th>Type</th><th style="text-align:right">Value</th></tr></thead><tbody>${rows}</tbody></table></div>
    <details class="more"><summary>Moving to a different computer?</summary><div>
      <p>Your numbers are saved only in this browser. To move them: click <b>Copy as a table</b> here, open this page on the other computer, and paste into the box below.</p>
      <textarea id="importBox" aria-label="Paste copied measurements"></textarea>
      <div class="btnrow"><button class="btn" id="importBtn">Load pasted numbers</button></div>
    </div></details>
    <details class="more"><summary>Prefer the spreadsheet?</summary><div><p>You can still use the original <a href="${esc(CONFIG.links.template)}" target="_blank" rel="noopener">measurements template (.xlsx)</a> or the <a href="${esc(CONFIG.links.drawingPdf)}" target="_blank" rel="noopener">drawing PDF</a> on Canvas. The numbers here match them.</p></div></details>
    <details class="more"><summary>Start over</summary><div><p>This erases every measurement and checkmark on this computer.</p>
      <div class="btnrow"><button class="btn" id="resetAsk">Erase my progress</button><button class="btn primary" id="resetYes" hidden>Yes, erase everything</button></div></div></details>
  </section>`;
}

/* ---------- events ---------- */
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function tableText(){
  const L=["Part\tDimension\tValue (mm)\tDescription"];
  PARTS.forEach(p=>p.dims.forEach(d=>{const v=value(p.id,d[0]);L.push(`${pname(p.id)}\t${d[0]}\t${v==null?"":fmt(v)}\t${d[2]}`)}));
  return L.join("\n");
}
function refreshCalcs(pid){
  document.querySelectorAll("[data-calc]").forEach(el=>{const [p,d]=el.dataset.calc.split(".");const v=value(p,d);
    el.classList.toggle("empty",v==null);el.firstChild.nodeValue=(v==null?"waiting":fmt(v))+" ";});
  const p=P[pid]; const lab=document.getElementById("mcount"); if(lab&&p) lab.textContent=`${measuredCount(p)} of ${measurable(p).length} measured`;
  const ms=document.getElementById("missing"); if(ms&&p) ms.innerHTML=missingNote(p);
  const tab=document.querySelector(`.parts [data-part="${pid}"] .chip`); if(tab&&!S.modeled[pid]) tab.textContent=`${measuredCount(p)}/${measurable(p).length}`;
  renderSteps(route());
}
function bind(v){
  document.querySelectorAll(".parts button").forEach(b=>b.onclick=()=>{S.part.cur=b.dataset.part;save();render()});
  document.querySelectorAll("[data-next-part]").forEach(b=>b.onclick=()=>{const i=PARTS.findIndex(p=>p.id===S.part.cur);
    S.part.cur=PARTS[Math.min(i+1,PARTS.length-1)].id;save();render();document.querySelector(".parts").scrollIntoView({block:"start",behavior:"smooth"})});
  document.querySelectorAll("input[data-key]").forEach(inp=>{
    const show=()=>{const h=checkHint(inp.dataset.key,inp.value);document.querySelector(`[data-h="${inp.dataset.key}"]`).textContent=h;inp.closest(".field").classList.toggle("bad",!!h)};
    show();
    inp.oninput=()=>{S.vals[inp.dataset.key]=inp.value.trim();save();show();refreshCalcs(inp.dataset.key.split(".")[0])};
    inp.onkeydown=e=>{if(e.key==="Enter"){const all=[...document.querySelectorAll("input[data-key]")];const n=all[all.indexOf(inp)+1];if(n)n.focus();else inp.blur()}};
  });
  document.querySelectorAll("[data-setup]").forEach(c=>c.onchange=()=>{S.setup[+c.dataset.setup]=c.checked;save();renderSteps(v)});
  document.querySelectorAll("[data-modeled]").forEach(c=>c.onchange=()=>{S.modeled[c.dataset.modeled]=c.checked;save();render()});
  document.querySelectorAll("[data-flag]").forEach(c=>c.onchange=()=>{S[c.dataset.flag]=c.checked;save();renderSteps(v);if(c.checked)toast("Nice work!")});
  document.querySelectorAll("[data-zoom]").forEach(el=>el.onclick=()=>{const k=el.dataset.zoom;const d=document.getElementById("lightbox");
    const cal=k.startsWith("cal_")?MT[k.slice(4)]:null, cap=document.getElementById("lbCap");
    document.getElementById("lbImg").src=IMG[k];document.getElementById("lbImg").alt=cal?cal.full:"";
    document.getElementById("lbTitle").textContent=cal?cal.full:(k==="dialog"?"Inventor Open dialog":pname(k));
    cap.hidden=!cal; cap.innerHTML=cal?cal.how:"";
    try{d.showModal()}catch(e){d.setAttribute("open","")}});
  const ca=document.getElementById("copyAll");
  if(ca) ca.onclick=()=>{const t=tableText();
    const fallback=()=>{const b=document.getElementById("importBox");b.closest("details").open=true;b.value=t;b.select();toast("Selected. Press Ctrl+C to copy.")};
    try{navigator.clipboard.writeText(t).then(()=>toast("Copied! Paste it into a Google Sheet."),fallback)}catch(e){fallback()}};
  const ib=document.getElementById("importBtn");
  if(ib) ib.onclick=()=>{let n=0;document.getElementById("importBox").value.split(/\n/).forEach(l=>{const c=l.split("\t");if(c.length<3)return;
      const p=PARTS.find(x=>pname(x.id)===c[0].trim());if(!p)return;const d=p.dims.find(x=>x[0]===c[1].trim());
      if(d&&d[1]==="m"&&c[2].trim()!==""&&num(c[2].trim())!=null){S.vals[p.id+"."+d[0]]=c[2].trim();n++}});
    save();render();toast(n?`Loaded ${n} measurements`:"Nothing found. Paste the copied table.")};
  document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{const f=BUNDLED[b.dataset.dl];
    const bin=atob(f.data), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:f.type})), a=document.createElement("a");
    a.href=url; a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast(`Downloading ${f.name}`)});
  const ra=document.getElementById("resetAsk"),ry=document.getElementById("resetYes");
  if(ra){ra.onclick=()=>{ry.hidden=false;ra.textContent="Keep my progress";ra.onclick=()=>render()};
    ry.onclick=()=>{S={vals:{},setup:[],modeled:{},assembled:false,rendered:false,part:{cur:"middle"}};save();location.hash="#start";render();toast("Progress erased")}}
}
render();
</script>
